name: Release Windows App

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $packageVersion = node -p "require('./package.json').version"
          if ($env:GITHUB_REF_NAME -ne "v$packageVersion") {
            throw "Tag $env:GITHUB_REF_NAME does not match package version v$packageVersion"
          }

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Build Windows portable app
        run: npx electron-builder --win --dir --config.win.signAndEditExecutable=false

      - name: Create portable ZIP
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          Compress-Archive `
            -Path 'release/win-unpacked/*' `
            -DestinationPath "release/PC-Management-Assistant-$version-windows-portable.zip" `
            -CompressionLevel Optimal

      - name: Build Windows installer
        id: installer
        continue-on-error: true
        run: npx electron-builder --win --config.win.signAndEditExecutable=false

      - name: Note installer fallback
        if: steps.installer.outcome == 'failure'
        shell: pwsh
        run: |
          'NSIS installer generation failed; the portable Windows ZIP will be published instead.' |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem release -File | Where-Object {
            $_.Extension -in '.exe', '.blockmap', '.zip' -or $_.Name -eq 'latest.yml'
          } | ForEach-Object { $_.FullName }

          if ($assets.Count -eq 0) {
            throw 'No release assets were generated.'
          }

          gh release create $env:GITHUB_REF_NAME @assets `
            --title "PC Management Assistant $env:GITHUB_REF_NAME" `
            --generate-notes
