name: Release Windows App

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $packageVersion = node -p "require('./package.json').version"
          if ($env:GITHUB_REF_NAME -ne "v$packageVersion") {
            throw "Tag $env:GITHUB_REF_NAME does not match package version v$packageVersion"
          }

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Build Windows portable app
        run: npx electron-builder --win --dir --config.win.signAndEditExecutable=false

      - name: Create portable ZIP
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          Compress-Archive `
            -Path 'release/win-unpacked/*' `
            -DestinationPath "release/PC-Management-Assistant-$version-windows-portable.zip" `
            -CompressionLevel Optimal

      - name: Build Windows installer
        run: npx electron-builder --win --config.win.signAndEditExecutable=false --publish never

      - name: Verify Windows packages
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $requiredFiles = @(
            'release/win-unpacked/PC Management Assistant.exe',
            "release/PC-Management-Assistant-$version-setup.exe",
            "release/PC-Management-Assistant-$version-windows-portable.zip"
          )

          foreach ($file in $requiredFiles) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Required Windows package was not generated: $file"
            }
          }

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = node -p "require('./package.json').version"
          $installer = "release/PC-Management-Assistant-$version-setup.exe"
          $portableZip = "release/PC-Management-Assistant-$version-windows-portable.zip"
          $notesFile = "release-notes/$env:GITHUB_REF_NAME.md"

          if (-not (Test-Path -LiteralPath $installer -PathType Leaf) -or
              -not (Test-Path -LiteralPath $portableZip -PathType Leaf)) {
            throw 'The verified installer and portable ZIP are required for release.'
          }

          $assets = Get-ChildItem release -File | Where-Object {
            $_.Extension -in '.exe', '.blockmap', '.zip' -or $_.Name -eq 'latest.yml'
          } | ForEach-Object { $_.FullName }

          if ($assets.Count -eq 0) {
            throw 'No release assets were generated.'
          }

          & gh release view $env:GITHUB_REF_NAME --json tagName *> $null
          if ($LASTEXITCODE -eq 0) {
            & gh release delete $env:GITHUB_REF_NAME --yes
            if ($LASTEXITCODE -ne 0) {
              throw 'Failed to remove the existing GitHub Release.'
            }
          }

          if (Test-Path -LiteralPath $notesFile -PathType Leaf) {
            & gh release create $env:GITHUB_REF_NAME @assets `
              --verify-tag `
              --title "V$version" `
              --notes-file $notesFile `
              --latest
          } else {
            & gh release create $env:GITHUB_REF_NAME @assets `
              --verify-tag `
              --title "V$version" `
              --generate-notes `
              --latest
          }
          if ($LASTEXITCODE -ne 0) {
            throw 'Failed to create the GitHub Release.'
          }

      - name: Verify published GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = node -p "require('./package.json').version"
          $releaseJson = & gh release view $env:GITHUB_REF_NAME --json tagName,name,assets
          if ($LASTEXITCODE -ne 0) {
            throw 'Failed to read the published GitHub Release.'
          }
          $release = $releaseJson | ConvertFrom-Json
          $latestTag = & gh api "repos/$env:GITHUB_REPOSITORY/releases/latest" --jq .tag_name
          if ($LASTEXITCODE -ne 0) {
            throw 'Failed to read the Latest GitHub Release.'
          }
          $assetNames = @($release.assets | ForEach-Object { $_.name })
          $requiredAssets = @(
            "PC-Management-Assistant-$version-setup.exe",
            "PC-Management-Assistant-$version-windows-portable.zip"
          )

          if ($release.tagName -ne $env:GITHUB_REF_NAME -or $release.name -ne "V$version") {
            throw 'The published release tag or title is incorrect.'
          }
          if ($latestTag -ne $env:GITHUB_REF_NAME) {
            throw 'The published release is not marked as Latest.'
          }
          foreach ($asset in $requiredAssets) {
            if ($assetNames -notcontains $asset) {
              throw "Required release asset is missing: $asset"
            }
          }
