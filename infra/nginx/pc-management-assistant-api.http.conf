# Bootstrap only: install before requesting the hostname's first certificate.
server {
    listen 80;
    listen [::]:80;
    server_name api.pc-management-assistant.setupmaru.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
