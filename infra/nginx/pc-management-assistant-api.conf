# Replace the bootstrap config with this file after the certificate exists.
server {
    listen 80;
    listen [::]:80;
    server_name api.pc-management-assistant.setupmaru.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.pc-management-assistant.setupmaru.com;

    ssl_certificate /etc/letsencrypt/live/api.pc-management-assistant.setupmaru.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.pc-management-assistant.setupmaru.com/privkey.pem;
    client_max_body_size 32m;

    location / {
        proxy_pass http://127.0.0.1:3400;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
